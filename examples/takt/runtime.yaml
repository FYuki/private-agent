version: 1

provider:
  defaults:
    # profile: opus5
    # profile: sol-xhigh
    profile: luna-xhigh

  profiles:
    sol-xhigh:
      provider: codex
      model: gpt-6-sol
      options:
        reasoning_effort: xhigh
    sol-medium:
      provider: codex
      model: gpt-6-sol
      options:
        reasoning_effort: medium
    # terra-medium:
    #   provider: codex
    #   model: gpt-5.6-terra
    #   options:
    #     reasoning_effort: medium
    luna-xhigh:
      provider: codex
      model: gpt-6-luna
      options:
        reasoning_effort: xhigh
    opus5:
      provider: claude
      model: claude-opus-5.5
    cloud-model:
      provider: claude
      model: claude-sonnet-4-6
    devin-swe2:
      provider: pi
      model: devin/swe-2-max
      options:
        thinking_level: max
        extensions:
          - npm:pi-devin-connector@0.1.2
        no_extensions: true

  targets:
    internal_agents:
      assistant:
        # profile: opus5
        profile: sol-xhigh
    steps:
      review/review-synthesis:
        # profile: terra-medium
        # profile: devin-swe2
        profile: sol-medium
        # profile: luna-xhigh
      review/supervise:
        profile: sol-medium
    tags:
      plan:
        profile: sol-xhigh
      coding:
        profile: sol-medium
        # profile: devin-swe2
        # profile: luna-xhigh
      review:
        # profile: devin-swe2
        profile: sol-medium
        # profile: luna-xhigh
      adjudication:
        # profile: terra-medium
        # profile: devin-swe2
        profile: sol-medium
        # profile: luna-xhigh
      verification:
        # profile: terra-medium
        # profile: devin-swe2
        profile: sol-medium
        # profile: luna-xhigh
      supervise:
        profile: sol-medium
      merge-readiness:
        profile: sol-medium
      final-gate:
        profile: sol-medium
      cloud-model:
        profile: cloud-model
