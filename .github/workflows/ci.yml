name: CI
on:
  pull_request:
  push:
    branches: [main, 'epic/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04 # nested user/PID namespaces for the mandatory watch stub
    timeout-minutes: 10
    env:
      CI: 'true'
      REQUIRE_PID_NAMESPACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install sandbox dependencies and the same Node binary inside /usr
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo install -m 755 "$(command -v node)" /usr/bin/node
      - run: npm ci
      - run: npm run check:local
      - run: npm run check && npm test && npm run build
      - name: Pinned TAKT schema and builtin contract (no provider calls)
        run: npm ci --prefix runtime/takt --ignore-scripts && node --import tsx scripts/takt-config-check.ts && node --import tsx scripts/watch-contract-check.ts && node --import tsx scripts/watch-runtime-config-check.ts && node --import tsx scripts/watch-binding-check.ts && node --import tsx scripts/watch-runtime-smoke.ts
      - name: Isolated SQLite and loopback integration (no provider secrets)
        run: npm run test:local
